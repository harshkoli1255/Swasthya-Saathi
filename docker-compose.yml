
services:
  db:
    image: postgres:16-alpine
    container_name: swasthya_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swasthya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swasthya_dev}
      POSTGRES_DB: ${POSTGRES_DB:-swasthyasaathi}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swasthya}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: swasthya_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-swasthya_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-swasthya_minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swasthya_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-swasthya}:${POSTGRES_PASSWORD:-swasthya_dev}@db:5432/${POSTGRES_DB:-swasthyasaathi}
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-swasthya_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-swasthya_minio_secret}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app

volumes:
  postgres_data:
  minio_data:
