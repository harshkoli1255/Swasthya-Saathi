<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="swasthyaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#194833"/>
      <stop offset="100%" stop-color="#0E2D1E"/>
    </linearGradient>
    <linearGradient id="swasthyaGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#286B4D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0E2D1E" stop-opacity="0"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#06180F" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="14" y="14" width="228" height="228" rx="58" ry="58" fill="url(#swasthyaBg)"/>
  <rect x="14" y="14" width="228" height="228" rx="58" ry="58" fill="url(#swasthyaGlow)"/>
  <rect x="14.5" y="14.5" width="227" height="227" rx="57.5" ry="57.5" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5"/>

  <!-- Inner Protective Shield / Dome Canopy -->
  <!-- Smooth arch over top, curving down to wings, with clean upward chevron at bottom -->
  <path
    d="M 86 166 
       C 75 166 69 156 71 144 
       C 73 108 94 76 128 76 
       C 162 76 183 108 185 144 
       C 187 156 181 166 170 166 
       C 162 166 156 160 152 156 
       L 128 138 
       L 104 156 
       C 100 160 94 166 86 166 Z"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="17"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#subtleShadow)"
  />

  <!-- Centered AYUSH Medical Plus Cross -->
  <!-- Vertical Bar -->
  <rect x="119.5" y="93" width="17" height="48" rx="8.5" ry="8.5" fill="#FFFFFF" filter="url(#subtleShadow)"/>
  <!-- Horizontal Bar -->
  <rect x="104" y="108.5" width="48" height="17" rx="8.5" ry="8.5" fill="#FFFFFF" filter="url(#subtleShadow)"/>
</svg>
